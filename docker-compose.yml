# Pin the compose project name: bin/*.sh look up the one-off `compose run`
# containers by the com.docker.compose.project label, and without this it
# would default to the checkout directory name instead.
name: dockercode

services:
  dockercode:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: dockercode
    stdin_open: true
    tty: true
    # Docker defaults /dev/shm to 64MB; Chromium/Electron exhaust it and the
    # GPU process dies (crash-loop + core dumps on the host)
    shm_size: "1gb"
    # Privileged for docker-in-docker: a contained dockerd runs from the
    # entrypoint (nested containers are invisible to the host daemon).
    # Privileged also unconfines seccomp (the Chromium/Electron user-namespace
    # sandbox needs that) and grants CAP_SYS_ADMIN plus full device access,
    # so the former security_opt/cap_add/device_cgroup_rules grants are gone.
    privileged: true
    volumes:
      - ./homedir:/home/coder
      # GUI: host display session (Wayland socket + XWayland) and GPU.
      # Missing host paths are auto-created empty, apps then fall back to software rendering.
      - /run/user/${USER_UID:-1000}:/run/user/${USER_UID:-1000}
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/dri:/dev/dri
      # FUSE for AppImages: bind the device when present (if missing, Docker
      # creates an empty dir and AppImages just refuse to mount), and allow its
      # standard char device (10:229) in the device cgroup
      - /dev/fuse:/dev/fuse
    # GIDs of the host video/render groups, exported by bin/start-gui.sh, so the
    # container user may access /dev/dri
    group_add:
      - "${VIDEO_GID:-998}"
      - "${RENDER_GID:-999}"
    environment:
      # mode switch read by the entrypoint: gui (this service) runs the
      # contained dbus session/portal; console (dockercode-console) skips it
      - DOCKERCODE_MODE=gui
      - TERM=${TERM}
      - COLUMNS=${COLUMNS}
      - LINES=${LINES}
      # X11 through the host's XWayland. Native Wayland is currently broken for
      # Electron apps in this setup (window is created hidden and ready-to-show
      # never fires, so it never gets shown; the GPU process also crash-loops).
      # Test native Wayland with: ELECTRON_OZONE_PLATFORM_HINT=wayland
      - DISPLAY=${DISPLAY:-}
      - XAUTHORITY=${XAUTHORITY:-}
      - ELECTRON_OZONE_PLATFORM_HINT=${ELECTRON_OZONE_PLATFORM_HINT:-x11}
      # URL opener of last resort for tools that consult $BROWSER directly;
      # the shim prints URLs instead of failing to find a browser
      - BROWSER=/usr/local/bin/xdg-open
      # session/runtime sockets live in the mounted XDG_RUNTIME_DIR; without the
      # bus address, Electron apps block on session-bus calls at startup.
      # The entrypoint replaces the host bus with a contained one (see
      # entrypoint.sh) so GUI apps never reach the host's xdg-desktop-portal,
      # whose file picker would expose host paths; this stays as the fallback.
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/run/user/${USER_UID:-1000}
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${USER_UID:-1000}/bus
    # Port 4096 (opencode) is deliberately NOT published on the host: it is
    # reachable only on the container's own IP (from the host and sibling
    # containers on the compose network), which bin/start-gui.sh looks up and
    # prints at launch.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1

  # Text-console-only twin of dockercode: same image and homedir, but no GUI
  # wiring at all - no host display/GPU/device mounts or group_add, no
  # contained dbus session/portal in the entrypoint (DOCKERCODE_MODE=console
  # makes it skip all that). Still privileged for docker-in-docker. Use it
  # with bin/start-console.sh when only terminal tools are needed: no
  # dependency on the host's X/Wayland session being up.
  dockercode-console:
    image: dockercode
    stdin_open: true
    tty: true
    shm_size: "1gb"
    volumes:
      - ./homedir:/home/coder
    # privileged for docker-in-docker, same as the GUI service
    privileged: true
    environment:
      - DOCKERCODE_MODE=console
      - TERM=${TERM}
      - COLUMNS=${COLUMNS}
      - LINES=${LINES}
      - BROWSER=/usr/local/bin/xdg-open
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 1.1.1.1

