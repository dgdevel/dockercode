# Pin every portal interface implemented by xdg-desktop-portal-gtk to the
# in-container gtk backend. Electron/Chromium file dialogs are portal-only,
# so this backend decides which filesystem the apps' open/save dialogs browse:
# the contained one (i.e. /home/coder), never the host layout behind the
# bind mounts. See README.md, "File pickers stay in the container".
[preferred]
default=gtk
